<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glassFoil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="115" fill="url(#glassFoil)"/>

  <!-- Stopwatch Ring Outer -->
  <g filter="url(#glow)">
    <circle cx="256" cy="275" r="145" fill="rgba(15, 23, 42, 0.45)" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Top Stopwatch Crown/Button -->
    <rect x="238" y="86" width="36" height="32" rx="8" fill="#ffffff"/>
    <rect x="224" y="74" width="64" height="16" rx="8" fill="#e0e7ff"/>

    <!-- Bar Chart Elements inside Stopwatch -->
    <!-- Bar 1 -->
    <rect x="180" y="295" width="28" height="55" rx="8" fill="url(#barGrad)" opacity="0.8"/>
    <!-- Bar 2 (Taller) -->
    <rect x="222" y="240" width="28" height="110" rx="8" fill="url(#barGrad)" opacity="0.95"/>
    <!-- Bar 3 (Tallest) -->
    <rect x="264" y="195" width="28" height="155" rx="8" fill="#ffffff"/>
    <!-- Bar 4 -->
    <rect x="306" y="265" width="28" height="85" rx="8" fill="url(#barGrad)" opacity="0.85"/>

    <!-- Dynamic Sparkle / Star (Top Right) -->
    <path d="M385 140 C385 155 395 165 410 165 C395 165 385 175 385 190 C385 175 375 165 360 165 C375 165 385 155 385 140 Z" fill="#fde047"/>
  </g>
</svg>
